spring.application.name=backendtallersemillas
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tallersemillas}
spring.datasource.username=${DB_USER:tallersemillas}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173}

app.data-key=${DATA_ENCRYPTION_KEY}
