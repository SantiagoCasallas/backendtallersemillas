services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tallersemillas
      POSTGRES_USER: tallersemillas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallersemillas -d tallersemillas"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
